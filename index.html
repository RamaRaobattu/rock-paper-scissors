
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <style>
        .move-img{
            height:70px;

        }
        .name{
            font-size:40px;
        }
        .move-btn{
            background-color:transparent;
            border:none;
        }
    </style>
</head>
<body>
    <h2 class="name">Rock Paper Scissors</h2>
    <!-- ROCK BUTTON -->
    <button 
    class="move-btn"
    onclick="
    playGame('ROCK');
    "><img class="move-img" src="images/rock image.jpeg" alt="Rock"></button>
    <!-- PAPER BUTTON -->
    <button 
    class="move-btn"
    onclick="
        playGame('PAPER');
    "><img class="move-img" src="images/paper image.jpeg" alt="Paper"></button>
    <!-- SCISSORS BUTTON -->
    <button 
    class="move-btn"
    onclick="
    playGame('SCISSORS');
    "><img class="move-img" src="images/scissors image.jpeg" alt="Scissors"></button>
    <p class="js-result"></p>
    <p class="js-moves"></p> 
    <p class ="js-score"></p>
    <button onclick="
    score.wins=0;
    score.losses=0;
    score.ties=0;
    localStorage.setItem('score', JSON.stringify(score));
    updatescore();
    alert('score has been reset');
    "> Reset score</button>
    <script>
        const score = JSON.parse(localStorage.getItem('score')) || {
    wins: 0,
    losses: 0,
    ties: 0
};   
updatescore();
function playGame(playerMove){
    const computerguess=pickComputerMove();

        let result = '';
        if(playerMove==='SCISSORS'){
 if (computerguess === 'ROCK') {
            result = 'you lose';
        }
        else if (computerguess === 'PAPER') {
            result = 'you win';
        }
        else {
            result = 'tie';
        }
    }
    else if(playerMove==='PAPER'){
        if (computerguess === 'ROCK') {
            result = 'you win';
        }
        else if (computerguess === 'PAPER') {
            result = 'tie';
        }
        else {
            result = 'you lose';
        }
    }
    else if(playerMove==='ROCK'){
        if (computerguess === 'ROCK') {
            result = 'tie';
        }
        else if (computerguess === 'PAPER') {
            result = 'you lose';
        }
        else {
            result = 'you win';
        }
    }
    if(result==='you win'){
        score.wins++;
    }
    else if(result==='you lose'){
        score.losses++;
    }
    else {
        score.ties++;
    }
    localStorage.setItem('score',JSON.stringify(score));
    document.querySelector(".js-result").innerHTML=result;
    document.querySelector(".js-moves").innerHTML=`you ${playerMove} - computer ${computerguess}`;
    updatescore();
}
            function updatescore(){
document.querySelector(".js-score").innerHTML=`wins:${score.wins},losses:${score.losses}, ties:${score.ties}`;
    
            }
        
    function pickComputerMove(){
        const randomNumber = Math.random();
    let computerguess = '';
        if (randomNumber < 1/3) {
            computerguess = 'ROCK';
        }
        else if (randomNumber < 2/3) {
            computerguess = 'PAPER';
        }
        else {
            computerguess = 'SCISSORS';
        }
        return computerguess;
    }
    </script>

</body>
</html>
